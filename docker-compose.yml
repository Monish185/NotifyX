services:
  postgres:
    image: postgres:16-alpine
    container_name: notifyx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-notifyx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-notifyx}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notifyx-network

  redis:
    image: redis:7-alpine
    container_name: notifyx-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - notifyx-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: notifyx-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - notifyx-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: notifyx-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_API_URL: http://localhost:3001
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notifyx-api
    ports:
      - "${API_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - notifyx-network

  outbox-publisher:
    build:
      context: .
      dockerfile: apps/outbox-publisher/Dockerfile
    container_name: notifyx-outbox-publisher
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notifyx-outbox-publisher
      PUBLISHER_HEALTH_PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifyx-network

  inapp-worker:
    build:
      context: .
      dockerfile: apps/inapp-worker/Dockerfile
    container_name: notifyx-inapp-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notifyx-inapp-workers
      KAFKA_CLIENT_ID: notifyx-inapp-worker
      WORKER_HEALTH_PORT: 3003
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifyx-network

  email-worker:
    build:
      context: .
      dockerfile: apps/email-worker/Dockerfile
    container_name: notifyx-email-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notifyx-email-workers
      KAFKA_CLIENT_ID: notifyx-email-worker
      EMAIL_WORKER_PORT: 3004
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mock}
      AWS_REGION: ${AWS_REGION:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      NOTIFYX_RETRY_MAX_ATTEMPTS: ${NOTIFYX_RETRY_MAX_ATTEMPTS:-5}
      NOTIFYX_RETRY_BASE_DELAY_MS: ${NOTIFYX_RETRY_BASE_DELAY_MS:-5000}
      NOTIFYX_RETRY_MAX_DELAY_MS: ${NOTIFYX_RETRY_MAX_DELAY_MS:-900000}
      NOTIFYX_RETRY_JITTER_RATIO: ${NOTIFYX_RETRY_JITTER_RATIO:-0.5}
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifyx-network

  push-worker:
    build:
      context: .
      dockerfile: apps/push-worker/Dockerfile
    container_name: notifyx-push-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notifyx-push-workers
      KAFKA_CLIENT_ID: notifyx-push-worker
      PUSH_WORKER_PORT: 3005
      PUSH_PROVIDER: ${PUSH_PROVIDER:-mock}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      NOTIFYX_RETRY_MAX_ATTEMPTS: ${NOTIFYX_RETRY_MAX_ATTEMPTS:-5}
      NOTIFYX_RETRY_BASE_DELAY_MS: ${NOTIFYX_RETRY_BASE_DELAY_MS:-5000}
      NOTIFYX_RETRY_MAX_DELAY_MS: ${NOTIFYX_RETRY_MAX_DELAY_MS:-900000}
      NOTIFYX_RETRY_JITTER_RATIO: ${NOTIFYX_RETRY_JITTER_RATIO:-0.5}
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifyx-network

  sms-worker:
    build:
      context: .
      dockerfile: apps/sms-worker/Dockerfile
    container_name: notifyx-sms-worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notifyx-sms-workers
      KAFKA_CLIENT_ID: notifyx-sms-worker
      SMS_WORKER_PORT: 3006
      SMS_PROVIDER: ${SMS_PROVIDER:-mock}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      NOTIFYX_RETRY_MAX_ATTEMPTS: ${NOTIFYX_RETRY_MAX_ATTEMPTS:-5}
      NOTIFYX_RETRY_BASE_DELAY_MS: ${NOTIFYX_RETRY_BASE_DELAY_MS:-5000}
      NOTIFYX_RETRY_MAX_DELAY_MS: ${NOTIFYX_RETRY_MAX_DELAY_MS:-900000}
      NOTIFYX_RETRY_JITTER_RATIO: ${NOTIFYX_RETRY_JITTER_RATIO:-0.5}
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifyx-network

  scheduler:
    build:
      context: .
      dockerfile: apps/scheduler/Dockerfile
    container_name: notifyx-scheduler
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SCHEDULER_HEALTH_PORT: 3007
      SCHEDULER_POLL_INTERVAL_MS: ${SCHEDULER_POLL_INTERVAL_MS:-1000}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-50}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-notifyx}?schema=public
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3007/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - notifyx-network

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: notifyx-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - notifyx-network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: notifyx-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - notifyx-network

  grafana:
    image: grafana/grafana:10.3.3
    container_name: notifyx-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3008}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - notifyx-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  notifyx-network:
    driver: bridge
