name: Deploy — Staging (Manual)

on:
  # MANUAL DISPATCH ONLY — never auto-deploys to staging or production.
  # Triggered explicitly by an authorized team member via GitHub Actions UI or API.
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (e.g. git SHA like "abc12345" or "latest")'
        required: true
        default: 'latest'
      confirm:
        description: 'Type "staging" to confirm you intend to deploy to staging'
        required: true
        default: ''

env:
  PNPM_VERSION: '9.15.0'
  NODE_VERSION: '22'
  AWS_REGION: 'us-east-1'

jobs:
  validate:
    name: Pre-Deploy Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate deployment confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "staging" ]; then
            echo "❌ Deployment aborted: confirmation input was not 'staging'"
            echo "   You must type exactly 'staging' in the confirm field."
            exit 1
          fi
          echo "✅ Deployment confirmed for STAGING environment."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  ecr-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: validate

    # Uses GitHub OIDC — no static AWS credentials stored in GitHub secrets
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # AWS_DEPLOY_ROLE_ARN should be an IAM role with:
          # - ecr:GetAuthorizationToken
          # - ecr:BatchCheckLayerAvailability
          # - ecr:InitiateLayerUpload
          # - ecr:UploadLayerPart
          # - ecr:CompleteLayerUpload
          # - ecr:PutImage
          # See docs/aws_deployment.md for the minimum IAM policy.

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push all images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          node scripts/build-and-push-ecr.js \
            --registry=$ECR_REGISTRY \
            --region=${{ env.AWS_REGION }} \
            --push

  # NOTE: Actual deployment to EC2 is documented but not automatically executed here.
  # Deploying to EC2 requires SSH access to the instance and is typically done via
  # a secure bastion or AWS Systems Manager Session Manager.
  # See docs/aws_deployment.md for the manual deployment procedure.
  post-push-notice:
    name: Post-Push Notice
    runs-on: ubuntu-latest
    needs: ecr-push

    steps:
      - name: Deployment image notice
        run: |
          echo "================================================================"
          echo "✅ NotifyX images have been pushed to ECR."
          echo ""
          echo "Image Tag: ${{ github.event.inputs.image_tag }}"
          echo ""
          echo "IMPORTANT: Deploying to the staging EC2 instance is a MANUAL step."
          echo "Follow the deployment procedure in docs/aws_deployment.md:"
          echo ""
          echo "  1. SSH to staging EC2 (via Session Manager or bastion)"
          echo "  2. Pull updated images from ECR"
          echo "  3. Run Prisma migrations: pnpm --filter @notifyx/database db:deploy"
          echo "  4. Restart services in order (API, Publisher, Workers, Dashboard)"
          echo "  5. Run smoke test: SMOKE_ENV=staging node scripts/smoke-test.js"
          echo "================================================================"
